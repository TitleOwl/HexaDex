<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HexaDex · เลือกเอฟเฟกต์ธาตุ</title>
<style>
  :root { --bg:#100d18; --card:#1a1622; --stage1:#2a2333; --stage2:#15121c; --line:#2e2838; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#e9e4f0; font-family:-apple-system,"Segoe UI",sans-serif; padding:24px 20px 120px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#9a90ad; font-size:13px; margin:0 0 24px; }
  .type { margin:0 0 30px; }
  .type-head { display:flex; align-items:baseline; gap:10px; margin:0 0 10px; }
  .type-head b { font-size:17px; }
  .type-head small { color:#8a82a0; font-size:12px; }
  .row { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  @media (max-width:780px){ .row{ grid-template-columns:repeat(2,1fr);} }
  .card { border:2px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; background:var(--card); transition:.15s; position:relative; }
  .card:hover { border-color:#5a4f78; }
  .card.sel { border-color:#b69bff; box-shadow:0 0 0 3px #b69bff44, 0 8px 24px #0008; }
  .stage { position:relative; height:230px; background:linear-gradient(180deg,var(--stage1),var(--stage2)); overflow:hidden; }
  .stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; mix-blend-mode:screen; }
  .stage .ball { position:absolute; left:50%; bottom:30px; transform:translateX(-50%); width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#fff 0 6%,#e64b4b 6% 49%,#222 49% 53%,#f4f4f4 53% 60%,#cfcfcf 60% 100%); opacity:.35; }
  .meta { display:flex; justify-content:space-between; padding:7px 10px; font-size:11px; color:#9a90ad; }
  .pick { position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; background:#0008; border:2px solid #fff6; display:grid; place-items:center; font-size:13px; }
  .card.sel .pick { background:#b69bff; border-color:#fff; color:#1a1622; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#0d0a14ee; backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:14px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .bar .count { font-size:13px; color:#c9c0db; }
  button { font:inherit; font-size:13px; font-weight:600; border:none; border-radius:9px; padding:10px 16px; cursor:pointer; }
  .primary { background:#b69bff; color:#1a1622; }
  .ghost { background:#241f31; color:#c9c0db; }
  textarea { flex:1; min-width:220px; background:#06040b; color:#9be36a; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-family:ui-monospace,monospace; font-size:12px; resize:none; height:40px; }
  .empty { color:#c97; font-size:13px; }
</style>
</head>
<body>
  <h1>เลือกเอฟเฟกต์ธาตุ 🎬</h1>
  <p class="sub">กดเลือกคลิปที่ชอบของแต่ละธาตุ (วิดีโอแสดงบนพื้นเวทีมืดแบบเดียวกับหน้า 3D จริง) → กด <b>คัดลอกคำสั่ง</b> ด้านล่าง แล้วส่งให้ผมรัน</p>
  <div id="app"><p class="empty">กำลังโหลด… ถ้าว่างเปล่า ให้รัน <code>MODE=candidates</code> ก่อน</p></div>

  <div class="bar">
    <span class="count" id="count">เลือกแล้ว 0/0</span>
    <button class="ghost" id="firstAll">เลือกอันแรกทั้งหมด</button>
    <button class="primary" id="copy">คัดลอกคำสั่ง APPLY</button>
    <textarea id="out" readonly placeholder='APPLY="…"'></textarea>
  </div>

<script>
const TYPES = [
  ["normal","ธรรมดา","⭐"],["fire","ไฟ","🔥"],["water","น้ำ","💧"],["electric","ไฟฟ้า","⚡"],
  ["grass","หญ้า","🌿"],["ice","น้ำแข็ง","❄️"],["fighting","ต่อสู้","🥊"],["poison","พิษ","☠️"],
  ["ground","ดิน","⛰️"],["flying","บิน","🌪️"],["psychic","จิต","🔮"],["bug","แมลง","🐛"],
  ["rock","หิน","🪨"],["ghost","ผี","👻"],["dragon","มังกร","🐉"],["dark","มืด","🌑"],
  ["steel","เหล็ก","⚙️"],["fairy","แฟรี่","🧚"],
];
const choices = {};
let manifest = {};

const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const v = e.target;
    if (e.isIntersecting) v.play?.().catch(()=>{}); else v.pause?.();
  }
}, { rootMargin: "100px" });

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  let total = 0;
  for (const [type, th, emoji] of TYPES) {
    const items = manifest[type] || [];
    if (!items.length) continue;
    total++;
    const sec = document.createElement("div");
    sec.className = "type";
    sec.innerHTML = `<div class="type-head"><b>${emoji} ${th}</b><small>${type}</small></div>`;
    const row = document.createElement("div");
    row.className = "row";
    items.forEach((it, i) => {
      const idx = i + 1;
      const card = document.createElement("div");
      card.className = "card" + (choices[type] === idx ? " sel" : "");
      card.dataset.type = type; card.dataset.idx = idx;
      card.innerHTML = `
        <div class="stage">
          <div class="ball"></div>
          <video src="/effects/_candidates/${it.file}" muted loop playsinline preload="metadata"></video>
          <div class="pick">${choices[type] === idx ? "✓" : ""}</div>
        </div>
        <div class="meta"><span>#${idx} · ${it.w}×${it.h}</span><span>${it.mb}MB</span></div>`;
      card.onclick = () => { choices[type] = idx; render(); updateBar(); };
      row.appendChild(card);
      io.observe(card.querySelector("video"));
    });
    sec.appendChild(row);
    app.appendChild(sec);
  }
  window.__total = total;
  updateBar();
}

function applyStr() {
  return Object.entries(choices).map(([t,i]) => `${t}=${i}`).join(",");
}
function updateBar() {
  const n = Object.keys(choices).length;
  document.getElementById("count").textContent = `เลือกแล้ว ${n}/${window.__total||0}`;
  document.getElementById("out").value = n ? `APPLY="${applyStr()}"` : "";
}

document.getElementById("firstAll").onclick = () => {
  for (const [type] of TYPES) if ((manifest[type]||[]).length) choices[type] = 1;
  render();
};
document.getElementById("copy").onclick = async () => {
  const out = document.getElementById("out");
  if (!out.value) return alert("ยังไม่ได้เลือกธาตุไหนเลย");
  out.select();
  try { await navigator.clipboard.writeText(out.value); } catch {}
  document.execCommand?.("copy");
  const b = document.getElementById("copy");
  const t = b.textContent; b.textContent = "คัดลอกแล้ว ✓";
  setTimeout(() => b.textContent = t, 1400);
};

fetch("/effects/_candidates/manifest.json")
  .then(r => r.json())
  .then(m => { manifest = m; render(); })
  .catch(() => { document.getElementById("app").innerHTML =
    '<p class="empty">ไม่พบ manifest — รัน <code>PEXELS_KEY=… MODE=candidates node scripts/fetch-effects.mjs</code> ก่อน</p>'; });
</script>
</body>
</html>
