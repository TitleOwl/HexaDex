<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HexaDex · iOS Minimal restyle</title>
<style>
  /* ── iOS Minimal tokens (keeps the wine accent for identity) ── */
  .ios {
    --bg:#f3f1ec; --surface:#ffffff; --surface2:#faf8f4;
    --line:#e9e5dc; --line-strong:#ddd7ca;
    --txt:#1b1a1c; --txt2:#6c6a64; --txt3:#a29d92;
    --accent:#900603; --accent-soft:#b5302d; --accent-tint:#90060314;
    --shadow:0 1px 2px rgba(20,16,10,.05), 0 8px 24px rgba(20,16,10,.06);
    --r-sm:11px; --r-md:15px; --r-lg:20px;
  }
  .ios.dark {
    --bg:#0f0e11; --surface:#1a1920; --surface2:#201e26;
    --line:#2a2832; --line-strong:#37343f;
    --txt:#f3f0f7; --txt2:#a8a3b2; --txt3:#6f6a79;
    --accent:#ff5a57; --accent-soft:#ff8a87; --accent-tint:#ff5a571f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#26242a; font-family:-apple-system,"SF Pro Text","Segoe UI",sans-serif; padding:24px; }
  .topbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; }
  .topbar h1 { color:#fff; font-size:20px; margin:0; flex:1; }
  .seg-toggle { display:inline-flex; background:#3a373f; border-radius:11px; padding:3px; }
  .seg-toggle button { border:none; background:none; color:#bbb; font:inherit; font-size:13px; font-weight:600; padding:6px 14px; border-radius:8px; cursor:pointer; }
  .seg-toggle button.on { background:#fff; color:#111; }
  .ios.dark ~ * {}
  .stage { display:flex; gap:22px; flex-wrap:wrap; }

  .phone { width:380px; background:var(--bg); border-radius:30px; padding:18px 16px 22px; box-shadow:0 20px 60px rgba(0,0,0,.45); color:var(--txt); }

  /* header */
  .hd { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .hd .logo { width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--accent-soft)); display:grid; place-items:center; color:#fff; font-weight:800; }
  .hd .ttl { font-size:22px; font-weight:800; letter-spacing:-.5px; }
  .hd .ttl small { display:block; font-size:11px; font-weight:600; color:var(--txt3); letter-spacing:.12em; text-transform:uppercase; }
  .hd .av { margin-left:auto; width:34px; height:34px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); }

  /* search */
  .search { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 14px; color:var(--txt3); font-size:14px; margin-bottom:14px; box-shadow:var(--shadow); }

  /* segmented */
  .seg { display:flex; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:3px; margin-bottom:18px; }
  .seg b { flex:1; text-align:center; font-size:13px; font-weight:600; padding:8px; border-radius:9px; color:var(--txt2); }
  .seg b.on { background:var(--surface); color:var(--txt); box-shadow:0 1px 3px rgba(0,0,0,.12); }

  /* section title */
  .sect { font-size:12px; font-weight:700; color:var(--txt3); letter-spacing:.1em; text-transform:uppercase; margin:0 2px 10px; }

  /* card grid */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px; }
  .pcard { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; box-shadow:var(--shadow); }
  .pcard .num { font-size:11px; color:var(--txt3); font-weight:700; }
  .pcard .sp { height:84px; display:grid; place-items:center; font-size:46px; }
  .pcard .nm { font-size:15px; font-weight:700; letter-spacing:-.2px; }
  .chips { display:flex; gap:6px; margin-top:8px; }
  .chip { font-size:11px; font-weight:700; color:#fff; padding:3px 10px; border-radius:999px; }
  .c-grass{ background:#5fb35f;} .c-poison{ background:#9a5fb3;} .c-fire{ background:#e8783c;} .c-fly{ background:#8aa6e8;}

  /* grouped list (iOS inset) */
  .list { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .li { display:flex; align-items:center; gap:12px; padding:13px 15px; font-size:14px; }
  .li + .li { border-top:1px solid var(--line); }
  .li .ic { width:30px; height:30px; border-radius:9px; background:var(--accent-tint); color:var(--accent); display:grid; place-items:center; font-size:15px; }
  .li .arrow { margin-left:auto; color:var(--txt3); }
  .li .val { margin-left:auto; color:var(--txt3); font-size:13px; }

  /* buttons */
  .btns { display:flex; gap:10px; margin-top:18px; }
  .btn-cta { flex:1; background:var(--accent); color:#fff; border:none; font:inherit; font-weight:650; font-size:15px; padding:13px; border-radius:14px; cursor:pointer; }
  .btn-sec { flex:1; background:var(--surface2); color:var(--txt); border:1px solid var(--line); font:inherit; font-weight:600; font-size:15px; padding:13px; border-radius:14px; cursor:pointer; }

  .cap { color:#9aa; font-size:12px; text-align:center; margin-top:12px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>iOS Minimal · restyle ทั้งแอป (ดูก่อนลงจริง)</h1>
  </div>
  <div class="stage" id="stage"></div>

<script>
const view = (mode) => `
  <div>
    <div class="ios ${mode==='dark'?'dark':''}">
      <div class="phone">
        <div class="hd">
          <div class="logo">H</div>
          <div class="ttl">HexaDex<small>National Dex</small></div>
          <div class="av"></div>
        </div>
        <div class="search">🔍 ค้นหาโปเกมอน…</div>
        <div class="seg"><b class="on">ทั้งหมด</b><b>รายการโปรด</b><b>จับแล้ว</b></div>

        <div class="sect">แนะนำวันนี้</div>
        <div class="grid">
          <div class="pcard"><div class="num">#0001</div><div class="sp">🌱</div><div class="nm">Bulbasaur</div><div class="chips"><span class="chip c-grass">หญ้า</span><span class="chip c-poison">พิษ</span></div></div>
          <div class="pcard"><div class="num">#0004</div><div class="sp">🔥</div><div class="nm">Charmander</div><div class="chips"><span class="chip c-fire">ไฟ</span></div></div>
        </div>

        <div class="sect">เครื่องมือ</div>
        <div class="list">
          <div class="li"><span class="ic">⚔️</span> ตัวนับ Raid <span class="arrow">›</span></div>
          <div class="li"><span class="ic">🌤️</span> Weather Boost <span class="val">มีผล</span></div>
          <div class="li"><span class="ic">🥚</span> คำนวณฟักไข่ <span class="arrow">›</span></div>
        </div>

        <div class="btns">
          <button class="btn-cta">จับโปเกมอน</button>
          <button class="btn-sec">เทียบ</button>
        </div>
      </div>
      <p class="cap">${mode==='dark'?'🌙 Dark':'☀️ Light'}</p>
    </div>
  </div>`;
document.getElementById('stage').innerHTML = view('light') + view('dark');
</script>
</body>
</html>
