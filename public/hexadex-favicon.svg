<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pbRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e0392e"/>
      <stop offset="100%" stop-color="#a30f0c"/>
    </linearGradient>
    <linearGradient id="pbWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3e6ec"/>
    </linearGradient>
    <radialGradient id="pbGloss" cx="36%" cy="26%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pbClip"><circle cx="50" cy="50" r="44"/></clipPath>
  </defs>

  <!-- body -->
  <g clip-path="url(#pbClip)">
    <rect x="0" y="0"  width="100" height="50" fill="url(#pbRed)"/>
    <rect x="0" y="50" width="100" height="50" fill="url(#pbWhite)"/>
    <rect x="0" y="44" width="100" height="12" fill="#161d27"/>
    <ellipse cx="38" cy="26" rx="26" ry="15" fill="url(#pbGloss)" transform="rotate(-18 38 26)"/>
  </g>

  <!-- rim -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#161d27" stroke-width="6"/>

  <!-- centre button -->
  <circle cx="50" cy="50" r="15" fill="#161d27"/>
  <circle cx="50" cy="50" r="10" fill="#ffffff"/>
  <circle cx="50" cy="50" r="5.5" fill="url(#pbWhite)" stroke="#161d27" stroke-width="2"/>
</svg>
