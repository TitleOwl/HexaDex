<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HexaDex · ความโค้งปุ่มสไตล์ iOS</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d38; --txt:#e9eef6; --mut:#9aa6b8; --blue:#0a84ff; --blue2:#0060df; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,"SF Pro Text","Segoe UI",sans-serif; padding:26px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 22px; max-width:680px; line-height:1.55; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px; }
  .scale { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px 18px; }
  .scale h2 { font-size:16px; margin:0 0 2px; display:flex; align-items:center; gap:8px; }
  .scale .tag { font-size:11px; font-weight:700; color:#fff; background:var(--blue); border-radius:6px; padding:2px 7px; }
  .scale .vals { color:var(--mut); font-size:11px; font-family:ui-monospace,monospace; margin:0 0 16px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .lbl { width:100%; font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px; }

  /* base button looks — radius is overridden per scale via CSS vars */
  button, .chip, .seg, .field, .iconbtn, .card { font:inherit; border:none; cursor:pointer; }
  .cta { background:linear-gradient(180deg,var(--blue),var(--blue2)); color:#fff; font-weight:650; font-size:15px; padding:12px 20px; border-radius:var(--r-md); box-shadow:0 6px 16px #0a84ff44; }
  .sec { background:#222b38; color:#cfe0f5; font-weight:600; font-size:14px; padding:10px 18px; border-radius:var(--r-md); border:1px solid #33405200; }
  .pill { background:#2a3340; color:#dfe8f4; font-weight:600; font-size:13px; padding:8px 16px; border-radius:999px; }
  .iconbtn { width:42px; height:42px; display:grid; place-items:center; background:#222b38; color:#cfe0f5; border-radius:var(--r-sm); font-size:18px; }
  .chip { background:#1f2732; color:#bcd; font-size:12px; font-weight:600; padding:6px 12px; border-radius:var(--r-sm); border:1px solid var(--line); }
  .seg { display:inline-flex; background:#1c232e; border-radius:var(--r-sm); padding:3px; gap:3px; }
  .seg b { font-weight:600; font-size:13px; padding:7px 14px; border-radius:calc(var(--r-sm) - 3px); color:var(--mut); }
  .seg b.on { background:var(--blue); color:#fff; }
  .field { width:100%; background:#10151c; border:1px solid var(--line); color:var(--txt); padding:11px 14px; border-radius:var(--r-md); font-size:14px; }
  .card { background:#1b2230; border:1px solid var(--line); padding:14px; border-radius:var(--r-lg); color:var(--mut); font-size:12px; width:100%; }
  .fab { width:54px; height:54px; border-radius:var(--r-lg); background:linear-gradient(180deg,var(--blue),var(--blue2)); color:#fff; font-size:22px; display:grid; place-items:center; box-shadow:0 8px 20px #0a84ff55; }

  /* ── Scales ── */
  .s-tight    { --r-sm:6px;  --r-md:10px; --r-lg:14px; }
  .s-standard { --r-sm:8px;  --r-md:12px; --r-lg:16px; }
  .s-soft     { --r-sm:11px; --r-md:15px; --r-lg:20px; }
  .s-round    { --r-sm:14px; --r-md:18px; --r-lg:24px; }
</style>
</head>
<body>
  <h1>ความโค้งปุ่มสไตล์ iOS 🍎</h1>
  <p class="sub">เทียบ 4 สเกลความโค้ง (border-radius) ที่จะใช้ทั้งโปรเจกต์ — เลือกได้เลยว่าชอบสเกลไหน
    เดี๋ยวผมปรับตัวแปร <code>--radius-*</code> + กวาดค่าฮาร์ดโค้ดให้ตรงกันทั้งแอป
    (ปุ่มทรงเม็ดยา/วงกลมยังคงเป็น pill ตามเดิม)</p>

  <div class="grid" id="grid"></div>

<script>
const SCALES = [
  ["s-tight","Tight","คม เรียบ มินิมอล","sm 6 · md 10 · lg 14"],
  ["s-standard","Standard","มาตรฐาน iOS (แนะนำ)","sm 8 · md 12 · lg 16"],
  ["s-soft","Soft","โค้งนุ่ม ฟีลแอปสมัยใหม่","sm 11 · md 15 · lg 20"],
  ["s-round","Rounded","โค้งมาก ดูเป็นมิตร","sm 14 · md 18 · lg 24"],
];
const buttonsHTML = `
  <div class="row"><span class="lbl">ปุ่มหลัก / รอง</span>
    <button class="cta">บันทึก</button>
    <button class="sec">ยกเลิก</button>
    <button class="pill">ตัวกรอง</button>
  </div>
  <div class="row"><span class="lbl">ไอคอน / ชิป / FAB</span>
    <button class="iconbtn">★</button>
    <span class="chip">ไฟ</span>
    <span class="chip">น้ำ</span>
    <button class="fab">＋</button>
  </div>
  <div class="row"><span class="lbl">Segmented</span>
    <span class="seg"><b class="on">2D</b><b>3D</b><b>AR</b></span>
  </div>
  <div class="row"><span class="lbl">ช่องค้นหา</span>
    <input class="field" placeholder="ค้นหาโปเกมอน…" />
  </div>
  <div class="row"><span class="lbl">การ์ด</span>
    <div class="card">การ์ดโปเกมอน · #0001</div>
  </div>`;
document.getElementById('grid').innerHTML = SCALES.map(([cls,name,desc,vals]) => `
  <div class="scale ${cls}">
    <h2>${name}${cls==='s-standard'?'<span class="tag">แนะนำ</span>':''}</h2>
    <p class="vals">${vals}</p>
    ${buttonsHTML}
    <p style="color:var(--mut);font-size:12px;margin:6px 0 0">${desc}</p>
  </div>`).join('');
</script>
</body>
</html>
